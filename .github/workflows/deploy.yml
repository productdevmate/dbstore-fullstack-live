name: Deploy Daddybazaar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP package
        run: |
          echo "Creating deployment package..."

          # Zipping the necessary backend, frontend, and compose files
          zip -r project.zip \
            daddybazaar-backend \
            daddybazaar-frontend \
            docker-compose.yml \
            .env.example

          echo "Package created:"
          ls -lh project.zip

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_PRIVATEKEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ vars.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Copy ZIP to server
        run: |
          echo "Copying package to server..."

          scp -i ~/.ssh/deploy_key \
            project.zip \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_IP }}:/tmp/project.zip"

      - name: Extract ZIP on server and Deploy
        run: |
          echo "Extracting package on server..."

          ssh -i ~/.ssh/deploy_key \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_IP }}" << 'EOF'

          mkdir -p /home/ubuntu/dbadmin

          # Extract the files
          unzip -o /tmp/project.zip -d /home/ubuntu/dbadmin

          # Clean up the zip file
          rm -f /tmp/project.zip
          
          # Navigate to project and start docker-compose
          cd /home/ubuntu/dbadmin
          docker-compose up -d --build

          echo "Deployment completed successfully"

          EOF
