spring:
  profiles:
    active: dev
  application:
    name: daddybazaar-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daddybazaar}
    username: ${DB_USERNAME:daddybazaar}
    password: ${DB_PASSWORD:daddybazaar}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DaddyBazaarPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8910}
  error:
    include-message: always
    include-binding-errors: always

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForDaddyBazaarJwtTokenSigningThatIsAtLeast256BitsLong}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}        # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

# ===== Application Domain =====
app:
  domain: ${APP_DOMAIN:daddybazaar.com}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  trial-days: ${TRIAL_DAYS:14}

# ===== Storage =====
storage:
  provider: ${STORAGE_PROVIDER:local}       # local | s3 | r2
  local:
    upload-dir: ${STORAGE_LOCAL_DIR:./uploads}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8910/files}
  s3:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:daddybazaar}
    region: ${STORAGE_REGION:ap-south-1}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== Logging =====
logging:
  level:
    com.daddybazaar: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

# ===== OpenAPI =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false
